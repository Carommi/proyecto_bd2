<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto & Mensajes</title>

    <!-- Fuente moderna -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="estilos.css" />
</head>

<body>

    <!-- ===== BARRA DE NAVEGACIÓN (NAVBAR) ===== -->
    <header class="navbar">
        <div class="contenedor nav-contenido">
            <a href="index.html" class="logo"> Mi<strong>Tienda</strong></a>
            <nav class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="#productos">Productos</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
    </header>

    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <main class="contenedor" id="inicio">
        <div class="encabezado-principal">
            <h1>Contacto & Mensajes</h1>
            <p>Contáctanos o envíanos un mensaje</p>
        </div>

        <div class="panel-tienda">
            <!-- SECCIÓN 1: Formulario Contacto -->
            <section class="tarjeta" id="contacto">
                <h2 id="tituloFormulario">Contáctanos</h2>

                <form id="formularioContacto">
                    <!-- Campo oculto para almacenar el ID en caso de edición -->
                    <input type="hidden" id="contactoId" value="" />

                    <div class="campo">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" placeholder="Ej: Diana Rodríguez" required />
                    </div>

                    <div class="campo">
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" placeholder="Ej: diana@ejemplo.com" required />
                    </div>

                    <div class="campo">
                        <label for="asunto">Asunto:</label>
                        <input type="text" id="asunto" placeholder="Ej: Solicitud de reembolso" required></input>
                    </div>

                    <div class="campo">
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" placeholder="Ej: Tengo una pregunta sobre uno de sus productos..."
                            required></textarea>
                    </div>

                    <div class="acciones-form">
                        <button type="submit" id="btnGuardar" class="btn btn-guardar">Enviar Mensaje</button>
                        <button type="button" id="btnCancelar" class="btn btn-cancelar"
                            style="display: none;">Cancelar</button>
                    </div>
                </form>
            </section>

            <!-- SECCIÓN 2: Lista de Mensajes -->
            <section class="tarjeta" id="mensajes">
                <h2>Lista de Mensajes</h2>
                <div id="listaMensajes" class="lista-mensajes">
                    <!-- Los mensajes se cargan desde app.js -->
                </div>
            </section>
        </div>
    </main>

    <!-- ===== PIE DE PÁGINA (FOOTER) ===== -->
    <footer class="footer">
        <div class="contenedor footer-contenido">
            <p>&copy; 2026 Mi Tienda - Proyecto Formativo con Node.js, Express y MySQL.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>

</html>
